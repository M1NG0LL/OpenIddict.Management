name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build -c Release --no-restore

      - name: Run test suites
        run: |
          dotnet test tests/OpenIddict.Management.Core.Tests/OpenIddict.Management.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-tests.trx"
          dotnet test tests/OpenIddict.Management.Endpoints.Tests/OpenIddict.Management.Endpoints.Tests.csproj -c Release --no-build --logger "trx;LogFileName=endpoints-tests.trx"
          dotnet test tests/OpenIddict.Management.Storage.EfCore.Tests/OpenIddict.Management.Storage.EfCore.Tests.csproj -c Release --no-build --logger "trx;LogFileName=efcore-tests.trx"
          dotnet test tests/OpenIddict.Management.Dashboard.Tests/OpenIddict.Management.Dashboard.Tests.csproj -c Release --no-build --logger "trx;LogFileName=dashboard-tests.trx"
